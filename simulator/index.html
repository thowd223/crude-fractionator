<title>CDU Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Real-time operator training simulator for the 100 kBPSD crude and vacuum distillation unit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a control-room console. Top bar (clock, margin, alarms) / tabbed process view beside an operator panel /
   alarm banner and trend strip along the bottom. One deliberate night-shift look: deep slate, grey process graphics
   (ISA-101), colour kept for heat, product identity and alarms; sodium-amber marks what you can touch. */
:root {
  color-scheme: dark;
  --bg: #0b1114; --panel: #11191d; --panel-2: #172126; --panel-3: #1d2a30; --line: #253339; --line-2: #33444b;
  --ink: #dbe5e9; --ink-2: #aebcc3; --mute: #7f9099; --faint: #55656d;
  --accent: #f0a23a; --accent-ink: #1b1206; --cyan: #62c6e3; --ok: #58c487; --warn: #f2c94c; --alarm: #ff5b4e; --hh: #ff3b6b;
  --pipe: #4f5f67; --steel: #6c7c84; --vessel: #24323a; --vessel-edge: #5d6f78;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tag, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top top" "tabs panel" "view panel" "foot foot"; }

/* top bar */
#top { grid-area: top; display: flex; align-items: center; gap: 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 700 26px/1 var(--f-display); letter-spacing: .04em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi { display: flex; flex-direction: column; line-height: 1.05; }
.kpi small { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.kpi strong { font: 600 22px/1.1 var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.kpi strong.big { font-size: 28px; }
.kpi em { font-style: normal; font: 500 11.5px var(--f-data); color: var(--ink-2); }
.spacer { flex: 1; }
.clock { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 9px; font: 500 12px var(--f-data); color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 7px; padding: 6px 11px; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { border-color: #6b2a2a; color: #ffb3ad; background: #2a1414; }
.btn.small { padding: 3px 8px; font-size: 12px; }
#alarmBtn { display: flex; align-items: center; gap: 8px; }
#alarmBtn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
#alarmBtn.on .dot { background: var(--alarm); animation: blink 1s steps(2) infinite; }
#alarmBtn.hh .dot { background: var(--hh); }
@keyframes blink { 50% { opacity: .25; } }

/* tabs */
#tabs { grid-area: tabs; display: flex; gap: 2px; padding-top: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
#tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px 8px; color: var(--mute); font: 600 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
#tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
#tabs .mission { margin-left: auto; align-self: center; display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 12px; white-space: nowrap; }

/* views */
#views { grid-area: view; position: relative; min-height: 0; min-width: 0; }
.view { position: absolute; inset: 0; overflow: auto; }
.view[hidden] { display: none !important; }
#v-console { padding: 10px 12px 12px max(12px, env(safe-area-inset-left, 0px)); }
#mimic { width: 100%; min-width: 1050px; height: auto; display: block; }
#v-field { overflow: hidden; background: #070b0d; }
#field-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#field-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.flabel { position: absolute; transform: translate(-50%, -100%); background: rgba(10, 16, 19, .82); border: 1px solid var(--line-2); border-left: 3px solid var(--cyan);
  border-radius: 6px; padding: 4px 7px; font: 500 11.5px/1.35 var(--f-data); white-space: nowrap; pointer-events: auto; cursor: pointer; }
.flabel b { font: 600 13px var(--f-display); letter-spacing: .05em; color: var(--ink); display: block; }
.flabel.alarm { border-left-color: var(--alarm); }
.flabel.hot { border-left-color: var(--accent); }
.field-hud { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.field-hud .btn { background: rgba(17, 25, 29, .9); }
#field-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }

#v-cuts, #v-learn { padding: 14px 16px 18px max(16px, env(safe-area-inset-left, 0px)); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card h3 { margin: 0 0 2px; font: 600 17px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.card .sub { color: var(--mute); font-size: 12.5px; margin: 0 0 8px; max-width: 70ch; }
canvas.chart { width: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
table.q { width: 100%; border-collapse: collapse; font-size: 13px; }
table.q th { text-align: left; font: 500 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--mute); padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.q td { padding: 5px 6px; border-bottom: 1px solid #1a252a; vertical-align: middle; }
table.q td.n { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { position: relative; height: 8px; background: var(--panel-3); border-radius: 4px; min-width: 70px; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 600 11px var(--f-data); letter-spacing: .03em; }
.pill.ok { background: rgba(88, 196, 135, .14); color: var(--ok); }
.pill.off { background: rgba(255, 91, 78, .16); color: var(--alarm); }
.pill.warn { background: rgba(242, 201, 76, .15); color: var(--warn); }

/* operator panel */
#panel { grid-area: panel; grid-row: 2 / 4; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  padding-right: env(safe-area-inset-right, 0px); }
#panel header { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
#panel header h2 { margin: 0; font: 600 20px/1.1 var(--f-display); letter-spacing: .04em; }
#panel header p { margin: 2px 0 0; color: var(--mute); font-size: 12.5px; }
#panelBody { overflow-y: auto; padding: 4px 0 16px; min-height: 0; flex: 1; }
details.grp { border-bottom: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: flex; align-items: center; gap: 8px; font: 600 15px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: "▸"; color: var(--mute); font-size: 12px; transition: transform .15s; }
details.grp[open] > summary::before { transform: rotate(90deg); }
details.grp > summary .st { margin-left: auto; font: 500 11px var(--f-data); color: var(--mute); text-transform: none; letter-spacing: 0; }
.ctl { padding: 6px 16px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.ctl label { font-size: 13px; color: var(--ink); }
.ctl .tag { font-size: 10.5px; color: var(--mute); margin-left: 6px; }
.ctl .pv { font: 500 12px var(--f-data); color: var(--ink-2); text-align: right; white-space: nowrap; }
.ctl .row { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 74px; gap: 10px; align-items: center; }
.ctl input[type="number"] { width: 74px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 6px; font: 500 13px var(--f-data); text-align: right; color: var(--accent); }
.ctl .hint { grid-column: 1 / -1; font-size: 11.5px; color: var(--mute); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), var(--line-2) var(--p, 50%)); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line-2); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 3px solid var(--accent); margin-top: -6px; }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 3px solid var(--accent); }
.rd { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 4px 16px 10px; font-size: 12.5px; color: var(--ink-2); }
.rd b { font: 500 12.5px var(--f-data); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.rd b.bad { color: var(--alarm); } .rd b.warn { color: var(--warn); } .rd b.good { color: var(--ok); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 16px 12px; }
select.sel { background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 6px; font-size: 13px; max-width: 100%; }
.eq-card { padding: 12px 16px; }
.eq-card h4 { margin: 12px 0 4px; font: 600 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.eq-card p { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; max-width: 62ch; }
.eq-card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 12.5px; }
.eq-card dt { color: var(--mute); }
.eq-card dd { margin: 0; font-family: var(--f-data); font-size: 12px; color: var(--ink); }

/* footer: alarms + trends */
#foot { grid-area: foot; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); border-top: 1px solid var(--line); background: var(--panel); min-height: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
#alarms { border-right: 1px solid var(--line); height: 128px; overflow-y: auto; font-size: 12.5px; }
.al { display: grid; grid-template-columns: 50px 34px 96px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 10px 4px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid #172126; }
.al .t { font: 500 11px var(--f-data); color: var(--mute); }
.al .p { font: 700 10.5px var(--f-data); border-radius: 3px; text-align: center; padding: 1px 0; }
.al .p.HH { background: var(--hh); color: #fff; } .al .p.H { background: var(--alarm); color: #200; } .al .p.L { background: var(--warn); color: #221a00; } .al .p.T { background: #fff; color: #200; } .al .p.I { background: var(--panel-3); color: var(--ink-2); }
.al .g { font: 500 11.5px var(--f-data); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.al .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.al .why { background: none; border: 0; color: var(--cyan); font-size: 12px; padding: 0; }
.al.new .m { color: #fff; font-weight: 500; }
.al.cleared { opacity: .5; }
#alarms .empty { color: var(--mute); padding: 12px 16px; }
#trends { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); height: 128px; }
.tr { border-left: 1px solid #172126; padding: 6px 10px 4px; display: flex; flex-direction: column; min-width: 0; }
.tr:first-child { border-left: 0; }
.tr .h { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.tr .h span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tr .v { font: 600 19px/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.tr canvas { flex: 1; width: 100%; min-height: 0; }

/* mimic SVG classes */
#mimic text { font-family: var(--f-body); fill: var(--ink-2); }
#mimic .lbl { font: 600 13px var(--f-display); letter-spacing: .06em; fill: var(--ink); }
#mimic .lbl-s { font: 500 10.5px var(--f-body); fill: var(--mute); }
#mimic .val { font: 500 12px var(--f-data); fill: var(--ink); }
#mimic .val.sp { fill: var(--accent); }
#mimic .val.bad { fill: var(--alarm); }
#mimic .val.warn { fill: var(--warn); }
#mimic .pipe { fill: none; stroke: var(--pipe); stroke-width: 3; stroke-linejoin: round; }
#mimic .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 14; animation: flow 1.2s linear infinite; opacity: .9; }
#mimic .flow.v { stroke-dasharray: 3 10; }
@keyframes flow { to { stroke-dashoffset: -16; } }
#mimic .vessel { fill: var(--vessel); stroke: var(--vessel-edge); stroke-width: 1.5; }
#mimic .hit { cursor: pointer; }
#mimic .hit:hover .vessel, #mimic .hit:hover .box { stroke: var(--accent); }
#mimic .box { fill: #121b20; stroke: var(--line-2); stroke-width: 1; }
#mimic .sel .vessel, #mimic .sel .box { stroke: var(--accent); stroke-width: 2.5; }
#mimic .tour-ring { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 8 6; animation: flow 1s linear infinite; }
#mimic .alarm-ring { fill: none; stroke: var(--alarm); stroke-width: 2.5; animation: blink 1s steps(2) infinite; }
#mimic .chip { fill: #0e161a; stroke: var(--line-2); }
#mimic .chip.off { stroke: var(--alarm); }
@media (prefers-reduced-motion: reduce) { #mimic .flow, #mimic .tour-ring { animation: none; } #alarmBtn.on .dot { animation: none; } }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(4, 7, 9, .72); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; width: min(980px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.modal header { padding: 20px 24px 10px; }
.modal header h2 { margin: 0; font: 700 30px/1.05 var(--f-display); letter-spacing: .03em; text-wrap: balance; }
.modal header p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 10px 24px 24px; }
.mcard { text-align: left; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.mcard:hover { border-color: var(--accent); }
.mcard .k { font: 600 11px var(--f-data); letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
.mcard b { font: 700 21px/1.1 var(--f-display); letter-spacing: .03em; color: var(--ink); }
.mcard span { color: var(--ink-2); font-size: 13px; }
.mcard small { color: var(--mute); font-size: 12px; margin-top: auto; }
.brief { padding: 4px 24px 24px; display: grid; gap: 14px; }
.brief ul { margin: 0; padding-left: 20px; color: var(--ink-2); }
.brief li { margin: 3px 0; }
.coach { position: fixed; z-index: 40; width: min(400px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 16px 50px rgba(0, 0, 0, .55); padding: 14px 16px 12px; }
.coach .k { font: 600 11px var(--f-data); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.coach h3 { margin: 2px 0 6px; font: 700 22px/1.1 var(--f-display); letter-spacing: .03em; }
.coach p { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; }
.coach .live { font: 500 12.5px var(--f-data); color: var(--cyan); background: #0d1a1f; border-radius: 6px; padding: 6px 8px; margin-bottom: 10px; }
.coach .nav { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.coach .nav span { margin-right: auto; color: var(--mute); font: 500 12px var(--f-data); }
.objectives { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.objectives li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.objectives li::before { content: "○"; color: var(--mute); }
.objectives li.done::before { content: "●"; color: var(--ok); }
.objectives li.fail::before { content: "✕"; color: var(--alarm); }
#missionBox { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; z-index: 5; width: min(320px, calc(100% - 24px)); background: rgba(17, 25, 29, .95); border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; }
#missionBox h4 { margin: 0 0 6px; font: 700 17px var(--f-display); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
#missionBox h4 span { font: 500 12px var(--f-data); color: var(--accent); }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 60; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

/* learn */
.learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.lcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.lcard .k { font: 600 11px var(--f-data); color: var(--cyan); letter-spacing: .08em; text-transform: uppercase; }
.lcard h3 { margin: 0; font: 700 20px/1.1 var(--f-display); letter-spacing: .03em; }
.lcard p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.lcard .btn { align-self: flex-start; margin-top: auto; }
.learn-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; align-items: stretch; }
.learn-hero h2 { font: 700 36px/1.02 var(--f-display); margin: 0 0 8px; letter-spacing: .02em; text-wrap: balance; }
.learn-hero p { color: var(--ink-2); max-width: 65ch; margin: 0 0 10px; }
.factgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.factgrid div { background: var(--panel); padding: 10px 12px; }
.factgrid small { display: block; font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .07em; }
.factgrid b { font: 600 20px var(--f-display); letter-spacing: .02em; }

/* responsive */
@media (max-width: 1100px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(380px, 62vh) auto auto; grid-template-areas: "top" "tabs" "view" "panel" "foot"; height: auto; min-height: 100%; }
  body { overflow: auto; }
  #panel { grid-row: auto; border-left: 0; border-top: 1px solid var(--line); }
  #panelBody { max-height: none; }
  #foot { grid-template-columns: minmax(0, 1fr); }
  #alarms { border-right: 0; border-bottom: 1px solid var(--line); }
  #trends { grid-template-columns: repeat(3, minmax(0, 1fr)); height: 220px; }
  .grid2, .learn-hero { grid-template-columns: minmax(0, 1fr); }
  #top { flex-wrap: wrap; gap: 10px 16px; }
